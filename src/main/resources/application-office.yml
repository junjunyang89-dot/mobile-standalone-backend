# 公司共享库：Mini 局域网 3306。不要写 127.0.0.1:3307（隧道写库会和扫设备抢锁）。
# 切换：./scripts/use-db.sh office
spring:
  datasource:
    url: jdbc:mysql://${OFFICE_DB_HOST:192.168.10.5}:${OFFICE_DB_PORT:3306}/${DB_NAME:mobile_standalone}?useUnicode=true&characterEncoding=UTF-8&sslMode=DISABLED&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true&connectionCollation=utf8mb4_unicode_ci
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
      connection-timeout: 15000
      validation-timeout: 5000
      keepalive-time: 300000
