# 在家：连本机 MySQL（外置盘 APFS 镜像，见 ./scripts/local-db.sh），大文件也落外置盘。
# 切换：./scripts/use-db.sh home
spring:
  datasource:
    url: jdbc:mysql://${HOME_DB_HOST:127.0.0.1}:${HOME_DB_PORT:3306}/${DB_NAME:mobile_standalone}?useUnicode=true&characterEncoding=UTF-8&sslMode=DISABLED&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true&connectionCollation=utf8mb4_unicode_ci
    username: ${HOME_DB_USERNAME:root}
    password: ${HOME_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      connection-timeout: 5000
      validation-timeout: 3000

# 图片 / 包 / 报告等：直接放 MOVESPEED（exFAT 存普通文件没问题）
app:
  data-dir: /Volumes/MOVESPEED/mobile-standalone/files/data
  reports-dir: /Volumes/MOVESPEED/mobile-standalone/files/reports
  upload-dir: /Volumes/MOVESPEED/mobile-standalone/files/uploads/applications
  agent-upload-dir: /Volumes/MOVESPEED/mobile-standalone/files/uploads/agent-files
  screenshot-dir: /Volumes/MOVESPEED/mobile-standalone/files/screenshots
  screenshot:
    inspect-dir: /Volumes/MOVESPEED/mobile-standalone/files/screenshots-inspect
