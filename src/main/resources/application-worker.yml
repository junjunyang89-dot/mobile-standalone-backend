# 执行节点：扫本机设备并跑任务。安装包会用这个 profile 在本机拉起。
# 账号密码沿用 application.yml；只把库主机换成控制面那台（DB_HOST）。
server:
  port: ${WORKER_PORT:3001}
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:mobile_standalone}?useUnicode=true&characterEncoding=UTF-8&sslMode=DISABLED&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true&connectionCollation=utf8mb4_unicode_ci
app:
  node:
    role: WORKER
    control-plane-url: ${CONTROL_PLANE_URL:http://127.0.0.1:3080/api}
    advertise-url: ${APP_NODE_ADVERTISE_URL:http://127.0.0.1:3001/api}
